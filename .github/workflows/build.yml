name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: xcodebuild -project Sonexa.xcodeproj -scheme Sonexa -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -destination generic/platform=iOS
      
      - name: Archive
        run: xcodebuild archive -project Sonexa.xcodeproj -scheme Sonexa -archivePath Sonexa.xcarchive -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -destination generic/platform=iOS
      
      - name: Export
        run: |
          # Create IPA manually from archive
          mkdir -p Payload
          cp -R Sonexa.xcarchive/Products/Applications/Sonexa.app Payload/
          zip -r Sonexa.ipa Payload
          rm -rf Payload
      
      - uses: actions/upload-artifact@v4
        with:
          name: Sonexa-IPA
          path: Sonexa.ipa
