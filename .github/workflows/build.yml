name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Build
        run: xcodebuild -project Sonexa.xcodeproj -scheme Sonexa -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -destination generic/platform=iOS
      
      - name: Archive
        run: xcodebuild archive -project Sonexa.xcodeproj -scheme Sonexa -archivePath Sonexa.xcarchive -configuration Debug CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO -destination generic/platform=iOS
      
      - name: Export
        run: |
          cat > ExportOptions.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath Sonexa.xcarchive -exportPath Export -exportOptionsPlist ExportOptions.plist
      
      - uses: actions/upload-artifact@v4
        with:
          name: Sonexa-IPA
          path: Export/*.ipa
