name: Build and Test Sonexa

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: 'Run tests'
        required: false
        default: 'true'
        type: boolean
      clean_build:
        description: 'Clean build folder before building'
        required: false
        default: 'false'
        type: boolean
      destination:
        description: 'Build destination'
        required: false
        default: 'platform=iOS Simulator,name=iPhone 15'
        type: choice
        options:
          - 'platform=iOS Simulator,name=iPhone 15'
          - 'platform=iOS Simulator,name=iPhone 15 Pro'
          - 'platform=iOS Simulator,name=iPhone 14'
          - 'platform=iOS Simulator,name=iPhone SE (3rd generation)'
          - 'platform=iOS Simulator,name=iPad Pro (12.9-inch) (6th generation)'

jobs:
  build-and-test:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version
      
      - name: Show Build Environment
        run: |
          echo "Xcode Version:"
          xcodebuild -version
          echo ""
          echo "Available Simulators:"
          xcrun simctl list devices available
          echo ""
          echo "Swift Version:"
          swift --version
      
      - name: Clean Build Folder (if requested)
        if: ${{ inputs.clean_build == 'true' }}
        run: |
          xcodebuild clean -project Sonexa.xcodeproj -scheme Sonexa
      
      - name: Build Project
        run: |
          xcodebuild build \
            -project Sonexa.xcodeproj \
            -scheme Sonexa \
            -destination '${{ inputs.destination }}' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: build.log
          retention-days: 3
      
      - name: Run Tests (if requested)
        if: ${{ inputs.run_tests == 'true' }}
        run: |
          xcodebuild test \
            -project Sonexa.xcodeproj \
            -scheme Sonexa \
            -destination '${{ inputs.destination }}' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      
      - name: Archive Build (if successful)
        if: success()
        run: |
          xcodebuild archive \
            -project Sonexa.xcodeproj \
            -scheme Sonexa \
            -archivePath Sonexa.xcarchive \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -destination 'generic/platform=iOS'
      
      - name: Export IPA
        if: success()
        run: |
          # Create export options plist for unsigned app
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string></string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string></string>
              <key>provisioningProfiles</key>
              <dict></dict>
              <key>compileBitcode</key>
              <false/>
              <key>uploadSymbols</key>
              <false/>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath Sonexa.xcarchive \
            -exportPath Export \
            -exportOptionsPlist ExportOptions.plist
      
      - name: Upload IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Sonexa-IPA
          path: Export/*.ipa
          retention-days: 7
      
      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: ~/Library/Logs/DiagnosticReports/
          retention-days: 3
      
      - name: Build Summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Destination**: ${{ inputs.destination }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests Run**: ${{ inputs.run_tests }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Clean Build**: ${{ inputs.clean_build }}" >> $GITHUB_STEP_SUMMARY
