name: Code Quality Check

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  swiftlint:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install SwiftLint
        run: |
          brew install swiftlint
      
      - name: Run SwiftLint
        run: |
          swiftlint lint --reporter github-actions-logging
        continue-on-error: true
      
      - name: SwiftLint Summary
        if: always()
        run: |
          echo "## SwiftLint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SwiftLint analysis completed. Check the logs above for any warnings or errors." >> $GITHUB_STEP_SUMMARY
  
  format-check:
    runs-on: macos-14
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Install SwiftFormat
        run: |
          brew install swiftformat
      
      - name: Check Formatting
        run: |
          swiftformat --lint Sonexa/ SonexaTests/
        continue-on-error: true
      
      - name: Format Check Summary
        if: always()
        run: |
          echo "## SwiftFormat Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SwiftFormat check completed. If there are formatting issues, run swiftformat locally to fix them." >> $GITHUB_STEP_SUMMARY
